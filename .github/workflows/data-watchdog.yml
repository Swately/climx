# climx staleness watchdog — independent of the fetch logic (the AAP graft from
# D2 §9): asserts the repo's data is < 12h old and fails loudly if not, so
# "pipeline stuck" is visible (GitHub's failed-workflow e-mail) instead of silent.
# Offset from both the hour and the refresh cron.
name: data-watchdog
on:
  schedule:
    - cron: '41 3,7,11,15,19,23 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Checks the DEPLOYED site, not the repo checkout: a repo that is fresh
      # while the deploy is broken is exactly the failure this alarm exists for.
      - name: assert deployed freshness (<12h)
        run: |
          node -e '
            const url = "https://swately.github.io/climx/data/meta.json?cb=" + Date.now();
            fetch(url, { signal: AbortSignal.timeout(30000) })
              .then(r => r.ok ? r.json() : Promise.reject(new Error("HTTP " + r.status)))
              .then(meta => {
                if (!meta.fetchedAt) { console.error("no fetchedAt — pipeline never succeeded"); process.exit(1); }
                const ageH = (Date.now() - Date.parse(meta.fetchedAt)) / 3.6e6;
                console.log(`deployed data age: ${ageH.toFixed(1)}h (ok=${meta.ok}, lastAttempt=${meta.lastAttempt})`);
                if (ageH > 12) { console.error("STALE: deployed data older than 12h"); process.exit(1); }
              })
              .catch(err => { console.error("watchdog could not read the deployed meta.json: " + err.message); process.exit(1); });
          '

# Made with my soul - Swately <3
